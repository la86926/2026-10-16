<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9fd">
  <meta name="description" content="Un plano cartesiano para comprender cuatro formas de responder a una situación">
  <title>Plano de respuestas</title>
  <!-- Logo y favicon integrados: no se necesitan imágenes adicionales -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%23f9a8c4'/%3E%3Cstop offset='1' stop-color='%23997bea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='17' fill='url(%23g)'/%3E%3Cpath d='M32 11v42M11 32h42' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='7' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
  <style>
    /* Paleta clara por defecto: pocos elementos y jerarquía nítida */
    :root {
      font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-synthesis: none;
      --page:#faf9fd; --panel:#fff; --paper:#fff;
      --text:#283048; --muted:#6b7388; --line:#e8e5ef;
      --axis:#758099; --shadow:0 15px 55px rgba(48,38,85,.045);
      --ambient:#fcfbff; --button:#f6f4fa;
      --amber:#a97726; --amber-bg:#fff4dd; --amber-edge:#f3d6a3;
      --rose:#b85d82; --rose-bg:#fff0f5; --rose-edge:#f2c5d5;
      --sky:#2a819c; --sky-bg:#e9f8fc; --sky-edge:#b8e3ed;
      --green:#347e62; --green-bg:#e9f8ef; --green-edge:#b8e4ca;
      --accent:#9377bc; --accent-bg:#f3edfc; --accent-border:#d6c7ee;
      --ease:cubic-bezier(.22,1,.36,1);
      color-scheme:light;
    }
    html[data-theme="dark"] {
      --page:#151722; --panel:#1b1d2b; --paper:#242738;
      --text:#f1edf8; --muted:#aeb4c6; --line:#38394e;
      --axis:#a4a8bf; --shadow:0 18px 65px rgba(0,0,0,.12);
      --ambient:#171a27; --button:#2a2b3e;
      --amber:#ffd38d; --amber-bg:#43372b; --amber-edge:#796246;
      --rose:#ffacc8; --rose-bg:#482d3f; --rose-edge:#795166;
      --sky:#91e3fa; --sky-bg:#243d4b; --sky-edge:#4a7285;
      --green:#9de7bd; --green-bg:#264538; --green-edge:#4e7760;
      --accent:#dbbdfb; --accent-bg:#392c49; --accent-border:#645074;
      color-scheme:dark;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--text);min-width:300px;-webkit-font-smoothing:antialiased;transition:background .32s,color .32s}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .app{width:min(1120px,calc(100% - 38px));margin:0 auto;padding:0 0 26px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;height:68px}
    .logo{display:flex;align-items:center;justify-content:center;width:39px;height:39px;border:0;border-radius:12px;background:linear-gradient(135deg,#f5aacd,#a68be8);box-shadow:0 7px 17px rgba(182,119,175,.13)}
    .logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
    .theme-switch{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;font-weight:650;transition:background .2s,border-color .2s}
    .theme-switch:hover{border-color:var(--accent-border)}
    .theme-switch svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .scene{--focus:var(--accent);--focus-bg:var(--accent-bg);--focus-edge:var(--accent-border);position:relative;isolation:isolate;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);min-height:560px;transition:background .35s,border-color .35s}
    /* El plano conserva la cruz cartesiana en primer plano */
    .map{position:relative;width:100%;height:clamp(550px,68vh,670px);opacity:1;transition:opacity .36s ease,filter .36s ease;background:var(--panel)}
    .map::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.95%,rgba(132,137,156,.035) 50%,transparent 50.05%)}
    .axis{position:absolute;z-index:1;pointer-events:none;background:var(--axis);opacity:.81;transition:background .2s,box-shadow .25s,opacity .25s}
    .axis[data-half="x-neg"]{top:50%;left:27px;width:calc(50% - 27px);height:2px}
    .axis[data-half="x-pos"]{top:50%;left:50%;right:27px;height:2px}
    .axis[data-half="y-pos"]{left:50%;top:26px;height:calc(50% - 26px);width:2px}
    .axis[data-half="y-neg"]{left:50%;top:50%;bottom:26px;width:2px}
    .axis.is-lit{background:var(--focus);opacity:1;box-shadow:0 0 11px var(--focus)}
    .axis.is-dim{opacity:.18}
    .arrow{position:absolute;z-index:1;pointer-events:none;font-size:17px;line-height:1;color:var(--axis);font-weight:700}
    .arrow.top{top:9px;left:calc(50% - 6px)}
    .arrow.bottom{bottom:8px;left:calc(50% - 6px)}
    .arrow.left{left:9px;top:calc(50% - 9px)}
    .arrow.right{right:9px;top:calc(50% - 9px)}
    .axis-home{position:absolute;z-index:4;width:124px;height:44px}
    .axis-home[data-axis-home="y-pos"]{left:50%;top:27px;transform:translateX(-50%)}
    .axis-home[data-axis-home="y-neg"]{left:50%;bottom:27px;transform:translateX(-50%)}
    .axis-home[data-axis-home="x-neg"]{left:28px;top:50%;transform:translateY(-50%)}
    .axis-home[data-axis-home="x-pos"]{right:28px;top:50%;transform:translateY(-50%)}
    .axis-pill{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;text-align:center;background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-radius:14px;font-size:12px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.02);transition:color .2s,background .2s,border-color .2s,box-shadow .2s}
    .axis-pill small{font-size:9px;font-weight:750;letter-spacing:.1em;color:var(--muted)}
    .axis-pill.is-lit,.flying-pill{color:var(--focus)!important;background:var(--focus-bg)!important;border-color:var(--focus-edge)!important;box-shadow:0 0 19px color-mix(in srgb,var(--focus) 23%,transparent)}
    .axis-pill.is-lit small,.flying-pill small{color:var(--focus)}
    .axis-pill.travelling{visibility:hidden}
    .origin{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:73px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;border-radius:19px;border:1.5px solid var(--accent-border);background:var(--accent-bg);color:var(--text);box-shadow:0 4px 20px rgba(60,40,80,.07);transition:transform .2s,box-shadow .2s}
    .origin:hover{transform:translate(-50%,-50%) scale(1.04)}
    .origin b{font-size:10px;font-weight:800;letter-spacing:.045em}
    .origin small{font-size:11px;color:var(--accent);font-weight:750}
    .origin-note{position:absolute;z-index:9;left:50%;top:calc(50% + 49px);width:min(310px,calc(100% - 30px));transform:translateX(-50%);padding:16px 19px;background:var(--paper);border:1px solid var(--accent-border);border-radius:14px;box-shadow:0 12px 30px rgba(30,28,50,.13);font-size:13px;line-height:1.6;color:var(--text)}
    .origin-note[hidden]{display:none}
    .quadrant{--q:var(--accent);--q-bg:var(--accent-bg);--q-edge:var(--accent-border);position:absolute;z-index:2;width:clamp(140px,27%,268px);min-height:119px;padding:17px 19px;border:1.5px solid var(--q-edge);border-radius:17px;background:var(--q-bg);color:var(--q);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px;text-align:left;transition:transform .35s var(--ease),box-shadow .3s,border-color .2s,opacity .3s}
    .quadrant:hover,.quadrant:focus-visible,.quadrant.suggested{transform:translateY(-4px);box-shadow:0 10px 27px color-mix(in srgb,var(--q) 14%,transparent)}
    .quadrant[data-route="heal"]{--q:var(--rose);--q-bg:var(--rose-bg);--q-edge:var(--rose-edge);left:12%;top:19%}
    .quadrant[data-route="learn"]{--q:var(--amber);--q-bg:var(--amber-bg);--q-edge:var(--amber-edge);right:12%;top:19%}
    .quadrant[data-route="release"]{--q:var(--sky);--q-bg:var(--sky-bg);--q-edge:var(--sky-edge);left:12%;bottom:19%}
    .quadrant[data-route="thanks"]{--q:var(--green);--q-bg:var(--green-bg);--q-edge:var(--green-edge);right:12%;bottom:19%}
    .q-no{font-size:10px;font-weight:750;letter-spacing:.15em;opacity:.72}
    .q-name{font-size:clamp(22px,2.8vw,32px);font-weight:750;letter-spacing:-.055em;line-height:1.1}
    .q-open{position:absolute;top:15px;right:17px;font-size:15px;opacity:.65}
    /* Al entrar al detalle, el mapa se retira por completo: sin letras residuales */
    .scene[data-view="detail"] .map{position:absolute;inset:0;pointer-events:none;opacity:0;filter:blur(7px)}
    .detail{position:absolute;inset:0;z-index:6;visibility:hidden;opacity:0;pointer-events:none;padding:18px clamp(15px,4vw,42px) 34px;transition:opacity .4s ease,visibility .4s}
    .scene[data-view="detail"] .detail{position:relative;inset:auto;visibility:visible;opacity:1;pointer-events:auto;min-height:560px}
    .detail-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    /* Volver es la acción principal de navegación */
    .back{position:sticky;top:12px;z-index:12;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border:2px solid var(--accent-border);border-radius:14px;background:var(--accent-bg);color:var(--text);font-size:13px;font-weight:800;box-shadow:0 5px 16px rgba(94,68,139,.10);transition:transform .2s,background .2s}
    .back:hover{transform:translateX(-3px);background:var(--accent-border)}
    .back svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .route-tag{font-size:11px;font-weight:750;color:var(--focus);letter-spacing:.06em}
    .equation{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:35px auto 14px;min-height:55px}
    .eq-slot{width:133px;height:49px;flex:none}
    .eq-pill{opacity:0;transition:opacity .15s}
    .eq-pill.arrived{opacity:1}
    .operator{font-size:23px;font-weight:500;color:var(--muted)}
    .outcome{font-size:clamp(27px,4vw,40px);font-weight:800;letter-spacing:-.065em;color:var(--focus);opacity:0;transform:translateY(9px);transition:opacity .45s,transform .5s var(--ease)}
    .detail.ready .outcome{opacity:1;transform:translateY(0)}
    .lead{font-size:13px;line-height:1.55;color:var(--muted);max-width:610px;margin:9px auto 28px;text-align:center;opacity:0;transition:opacity .4s .12s}
    .detail.ready .lead{opacity:1}
    .case-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:966px;margin:0 auto}
    .case{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:22px;opacity:0;transform:translateY(15px);transition:opacity .5s,transform .5s var(--ease)}
    .detail.ready .case{opacity:1;transform:translateY(0)}
    .detail.ready .case:nth-child(1){transition-delay:.13s}
    .detail.ready .case:nth-child(2){transition-delay:.24s}
    .case-no{display:block;font-size:11px;color:var(--focus);font-weight:800;letter-spacing:.07em}
    .situation{font-size:14px;font-weight:650;line-height:1.55;letter-spacing:-.025em;margin:11px 0 17px;min-height:44px}
    .case-question{font-size:12px;font-weight:750;margin:0 0 11px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .choice{min-height:42px;padding:9px 10px;background:var(--button);color:var(--muted);border:1px solid var(--line);border-radius:10px;font-size:11px;font-weight:740;line-height:1.35;transition:background .2s,border-color .2s,color .2s}
    .choice:hover{border-color:var(--accent-border)}
    .choice[data-type="help"][aria-expanded="true"]{background:var(--green-bg);border-color:var(--green-edge);color:var(--green)}
    .choice[data-type="harm"][aria-expanded="true"]{background:var(--rose-bg);border-color:var(--rose-edge);color:var(--rose)}
    /* Persiana de respuestas; la explicación aparece solo al solicitarla */
    .answer-fold,.reflection-fold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .46s var(--ease),opacity .35s}
    .answer-fold.open,.reflection-fold.open{grid-template-rows:1fr;opacity:1}
    .answer-inner,.reflection-inner{min-height:0;overflow:hidden}
    .answer-box{margin-top:13px;padding:15px;border-left:3px solid var(--focus);border-radius:8px;background:var(--focus-bg);color:var(--text);font-size:12px;line-height:1.7}
    .answer-box[data-type="harm"]{border-color:var(--rose);background:var(--rose-bg)}
    .answer-box[data-type="help"]{border-color:var(--green);background:var(--green-bg)}
    .reflection{max-width:966px;margin:18px auto 0;padding:0;border:1px solid var(--line);border-radius:17px;overflow:hidden;opacity:0;transform:translateY(15px);transition:opacity .5s .31s,transform .5s .31s var(--ease)}
    .detail.ready .reflection{opacity:1;transform:translateY(0)}
    .reflection-label{padding:18px 20px 7px;color:var(--focus);font-size:11px;font-weight:800;letter-spacing:.04em}
    .reflection-item + .reflection-item{border-top:1px solid var(--line)}
    .reflection-button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:15px;padding:15px 20px;text-align:left;font-size:12px;font-weight:650;background:none;border:0;color:var(--text)}
    .reflection-button span:last-child{display:grid;place-items:center;flex:none;width:25px;height:25px;background:var(--button);border-radius:50%;font-size:17px;color:var(--accent);transition:transform .2s}
    .reflection-button[aria-expanded="true"] span:last-child{transform:rotate(45deg)}
    .reflection-inner p{font-size:12px;line-height:1.7;color:var(--muted);padding:0 20px 16px;margin:0;max-width:770px}
    .flying-layer{position:fixed;inset:0;pointer-events:none;z-index:1000}
    .flying-pill{position:fixed;z-index:1001;margin:0;will-change:transform;transform-origin:top left}
    .scene.busy button{pointer-events:none}
    @media(max-width:730px){
      .app{width:calc(100% - 22px)}
      .toolbar{height:59px}
      .scene{border-radius:18px;min-height:510px}
      .map{height:540px}
      .quadrant{width:36%;min-height:100px;gap:8px;padding:14px}
      .quadrant[data-route="heal"],.quadrant[data-route="learn"]{top:19%}
      .quadrant[data-route="release"],.quadrant[data-route="thanks"]{bottom:19%}
      .quadrant[data-route="heal"],.quadrant[data-route="release"]{left:8%}
      .quadrant[data-route="learn"],.quadrant[data-route="thanks"]{right:8%}
      .q-name{font-size:clamp(19px,4vw,27px)}
      .axis-home{width:108px;height:43px}
      .axis-home[data-axis-home="x-neg"]{left:16px}
      .axis-home[data-axis-home="x-pos"]{right:16px}
      .axis-home[data-axis-home="y-pos"]{top:19px}
      .axis-home[data-axis-home="y-neg"]{bottom:19px}
      .axis-pill{font-size:11px}
      .origin{width:97px;height:66px}
      .detail{padding:17px}
      .scene[data-view="detail"] .detail{min-height:510px}
      .case-grid{gap:11px}
      .case{padding:16px}
      .choices{grid-template-columns:1fr}
    }
    @media(max-width:540px){
      .map{height:505px}
      .quadrant{width:39%;min-height:96px;gap:8px;border-radius:13px;padding:12px}
      .quadrant[data-route="heal"],.quadrant[data-route="learn"]{top:21%}
      .quadrant[data-route="release"],.quadrant[data-route="thanks"]{bottom:21%}
      .quadrant[data-route="heal"],.quadrant[data-route="release"]{left:5%}
      .quadrant[data-route="learn"],.quadrant[data-route="thanks"]{right:5%}
      .q-no{font-size:9px}
      .q-name{font-size:clamp(18px,5.8vw,25px)}
      .q-open{top:9px;right:11px;font-size:12px}
      .axis-home{width:92px;height:39px}
      .axis-home[data-axis-home="x-neg"]{left:6px}
      .axis-home[data-axis-home="x-pos"]{right:6px}
      .axis-home[data-axis-home="y-pos"]{top:18px}
      .axis-home[data-axis-home="y-neg"]{bottom:18px}
      .axis-pill{font-size:10px;border-radius:10px}
      .axis-pill small{font-size:8px}
      .axis[data-half="x-neg"]{left:15px;width:calc(50% - 15px)}
      .axis[data-half="x-pos"]{right:15px}
      .origin{width:82px;height:61px;border-radius:14px}
      .origin b{font-size:9px}
      .origin small{font-size:10px}
      .detail{padding:15px 13px 25px}
      .back{padding:0 14px;min-height:45px;font-size:12px}
      .route-tag{font-size:10px}
      .equation{gap:6px;margin-top:30px}
      .eq-slot{width:86px;height:41px}
      .operator{font-size:18px}
      .outcome{font-size:clamp(19px,5.3vw,25px)}
      .lead{font-size:12px;margin:14px auto 20px}
      .case-grid{grid-template-columns:1fr}
      .case{padding:17px}
      .situation{min-height:0;margin:10px 0 13px;font-size:13px}
      .choices{grid-template-columns:1fr 1fr}
      .choice{font-size:10px}
      .reflection{margin-top:11px}
    }
    @media(max-width:350px){
      .eq-slot{width:80px}
      .outcome{font-size:19px}
      .choices{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="logo" role="img" aria-label="Logo de la página: plano cartesiano rosado y morado">
        <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3v24M3 15h24"/><circle cx="15" cy="15" r="4" fill="white" stroke="none"/></svg>
      </div>
      <button id="theme-switch" class="theme-switch" type="button" aria-label="Cambiar a modo oscuro">
        <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.3A8.4 8.4 0 0 1 9.7 3.6 8.4 8.4 0 1 0 20.4 14.3Z"/></svg>
        <span id="theme-label">Modo oscuro</span>
      </button>
    </div>
    <main>
      <section class="scene" id="scene" data-view="map" aria-label="Plano cartesiano: verdad y dolor">
        <div class="map" id="map">
          <span class="axis" data-half="x-neg"></span><span class="axis" data-half="x-pos"></span>
          <span class="axis" data-half="y-pos"></span><span class="axis" data-half="y-neg"></span>
          <span class="arrow top" aria-hidden="true">↑</span><span class="arrow bottom" aria-hidden="true">↓</span>
          <span class="arrow left" aria-hidden="true">←</span><span class="arrow right" aria-hidden="true">→</span>
          <button class="quadrant" type="button" data-route="heal" aria-label="Cuadrante II: Sana">
            <span class="q-no">II · −X / +Y</span><span class="q-name">SANA</span><span class="q-open" aria-hidden="true">↗</span>
          </button>
          <button class="quadrant" type="button" data-route="learn" aria-label="Cuadrante I: Aprende">
            <span class="q-no">I · +X / +Y</span><span class="q-name">APRENDE</span><span class="q-open" aria-hidden="true">↗</span>
          </button>
          <button class="quadrant" type="button" data-route="release" aria-label="Cuadrante III: Olvida">
            <span class="q-no">III · −X / −Y</span><span class="q-name">OLVIDA</span><span class="q-open" aria-hidden="true">↗</span>
          </button>
          <button class="quadrant" type="button" data-route="thanks" aria-label="Cuadrante IV: Da gracias">
            <span class="q-no">IV · +X / −Y</span><span class="q-name">DA GRACIAS</span><span class="q-open" aria-hidden="true">↗</span>
          </button>
          <div class="axis-home" data-axis-home="y-pos"><button class="axis-pill" type="button" data-axis-pill="y-pos">Te duele<small>+Y</small></button></div>
          <div class="axis-home" data-axis-home="y-neg"><button class="axis-pill" type="button" data-axis-pill="y-neg">No te duele<small>−Y</small></button></div>
          <div class="axis-home" data-axis-home="x-pos"><button class="axis-pill" type="button" data-axis-pill="x-pos">Es verdad<small>+X</small></button></div>
          <div class="axis-home" data-axis-home="x-neg"><button class="axis-pill" type="button" data-axis-pill="x-neg">No es verdad<small>−X</small></button></div>
          <button class="origin" id="origin" type="button" aria-controls="origin-note" aria-expanded="false"><b>EL SUCESO</b><small>(0,0)</small></button>
          <div class="origin-note" id="origin-note" hidden>Lo que ocurre es el punto de partida. Puedes elegir cómo responder sin negar lo que sientes.</div>
        </div>

        <article class="detail" id="detail" aria-label="Contenido del cuadrante" aria-hidden="true">
          <div class="detail-header">
            <button class="back" id="back" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/><path d="M7 12h13"/></svg>
              Volver al plano
            </button>
            <span class="route-tag" id="route-tag">CUADRANTE I</span>
          </div>
          <div class="equation" aria-label="Ecuación del cuadrante">
            <span class="eq-slot" id="eq-one"></span><span class="operator" aria-hidden="true">+</span>
            <span class="eq-slot" id="eq-two"></span><span class="operator" aria-hidden="true">=</span>
            <strong class="outcome" id="outcome">APRENDE</strong>
          </div>
          <p class="lead" id="lead"></p>
          <div class="case-grid" id="case-grid"></div>
          <section class="reflection" id="reflection" aria-label="Preguntas para pensar">
            <div class="reflection-label">PREGUNTAS PARA PENSAR</div>
            <div id="reflection-list"></div>
          </section>
        </article>
      </section>
    </main>
  </div>
  <div class="flying-layer" id="flying-layer" aria-hidden="true"></div>
  <script>
    "use strict";
    // Mensajes breves y casos cotidianos de adultos
    const routes = {
      learn: {
        name: "APRENDE", numeral: "I", axes: ["y-pos","x-pos"],
        color: "var(--amber)", bg: "var(--amber-bg)", edge: "var(--amber-edge)",
        lead: "Es cierto y te duele. Usa esa información para mejorar algo concreto.",
        cases: [
          {situation: "Un cliente tiene razón: entregaste un trabajo después de la fecha acordada.",
           question: "¿Cómo conviene responder?",
           harm: "Te justificas y culpas a otras personas. El retraso sigue sin resolverse.",
           help: "Reconoces el retraso, acuerdas una nueva fecha y cambias tu forma de organizar las entregas."},
          {situation: "Una compañera te dice, con razón, que interrumpes en las reuniones.",
           question: "¿Qué puedes hacer con esa crítica?",
           harm: "Te molestas y dices que así es tu personalidad. No corriges el hábito.",
           help: "Escuchas el ejemplo, dejas terminar a los demás y observas si mejora la conversación."}
        ],
        reflections: [
          ["¿Cómo distinguir una crítica útil?","Comprueba si describe un hecho específico. Quédate con la información que puedas verificar."],
          ["¿Qué hago si la verdad me incomoda?","Elige una conducta pequeña que puedas cambiar hoy. No necesitas atacarte para mejorar."]
        ]
      },
      heal: {
        name: "SANA", numeral: "II", axes: ["y-pos","x-neg"],
        color: "var(--rose)", bg: "var(--rose-bg)", edge: "var(--rose-edge)",
        lead: "No es cierto, pero te duele. Vale la pena atender lo que ese comentario activó.",
        cases: [
          {situation: "Una persona afirma que no eres capaz, aunque tus resultados dicen lo contrario.",
           question: "¿Qué te ayuda en esta situación?",
           harm: "Tratas de convencerla durante horas y terminas dudando de tus capacidades.",
           help: "Revisas los hechos, reconoces tu miedo a no ser suficiente y dejas de depender de su aprobación."},
          {situation: "Alguien hace un comentario falso sobre tu apariencia y no puedes dejar de pensarlo.",
           question: "¿Dónde conviene poner la atención?",
           harm: "Te comparas con los demás y repites la burla mentalmente.",
           help: "Identificas tu inseguridad, cuestionas esa etiqueta y buscas apoyo si el malestar continúa."}
        ],
        reflections: [
          ["¿Por qué me afecta algo falso?","Puede haber tocado una inseguridad anterior. Sentir dolor no convierte la afirmación en verdad."],
          ["¿Qué puedo hacer para cuidarme?","Háblate con respeto, busca apoyo si lo necesitas y pon límites a los comentarios ofensivos."]
        ]
      },
      release: {
        name: "OLVIDA", numeral: "III", axes: ["y-neg","x-neg"],
        color: "var(--sky)", bg: "var(--sky-bg)", edge: "var(--sky-edge)",
        lead: "No es cierto y no te duele. Puedes dejarlo pasar sin gastar energía.",
        cases: [
          {situation: "En un chat circula un rumor falso sobre tus planes del fin de semana.",
           question: "¿Vale la pena seguir la discusión?",
           harm: "Respondes a cada mensaje y haces que el rumor dure más.",
           help: "Si no hay consecuencias reales, no lo alimentas y sigues con tus actividades."},
          {situation: "Un desconocido escribe una crítica absurda sobre uno de tus gustos.",
           question: "¿Qué respuesta te conviene?",
           harm: "Discutes para tener la última palabra, aunque el asunto no importa.",
           help: "Reconoces que no cambia nada importante y dejas la conversación ahí."}
        ],
        reflections: [
          ["¿Todo comentario merece respuesta?","No. Atiende lo que tenga consecuencias reales; no necesitas responder a todo."],
          ["¿Cuándo conviene no ignorarlo?","Si causa daño, acoso o afecta tu reputación o seguridad, documenta los hechos y actúa."]
        ]
      },
      thanks: {
        name: "DA GRACIAS", numeral: "IV", axes: ["y-neg","x-pos"],
        color: "var(--green)", bg: "var(--green-bg)", edge: "var(--green-edge)",
        lead: "Es cierto y no te duele. Reconoce lo que has conseguido o superado.",
        cases: [
          {situation: "Antes te costaba hablar en reuniones; ahora participas con tranquilidad.",
           question: "¿Qué vale la pena reconocer?",
           harm: "Restas importancia a tu avance porque todavía no lo haces perfecto.",
           help: "Reconoces las veces que practicaste y la confianza que has desarrollado."},
          {situation: "Recuerdas un error real del pasado y ya puedes hablar de él sin vergüenza.",
           question: "¿Cómo mirar ese recuerdo?",
           harm: "Te reprochas no haber aprendido más rápido y te castigas otra vez.",
           help: "Reconoces lo que reparaste, lo que aprendiste y que hoy actúas de otra manera."}
        ],
        reflections: [
          ["¿Qué ha cambiado respecto de antes?","Compara tus reacciones anteriores con las actuales. Identifica un avance concreto."],
          ["¿A quién o a qué puedes agradecer?","A tu esfuerzo, a las personas que te apoyaron y a las decisiones que tomaste."]
        ]
      }
    };

    const $ = selector => document.querySelector(selector);
    const scene = $("#scene");
    const detail = $("#detail");
    const quadrants = Array.from(document.querySelectorAll(".quadrant"));
    const axisLines = Array.from(document.querySelectorAll(".axis"));
    const pills = Array.from(document.querySelectorAll("[data-axis-pill]"));
    const layer = $("#flying-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let current = null;
    let busy = false;

    // Cambiar entre tema claro y oscuro; sin botones ni menús adicionales
    function applyTheme(mode) {
      document.documentElement.dataset.theme = mode;
      const dark = mode === "dark";
      $("#theme-label").textContent = dark ? "Modo claro" : "Modo oscuro";
      $("#theme-switch").setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
      $("#theme-icon").innerHTML = dark
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>'
        : '<path d="M20.4 14.3A8.4 8.4 0 0 1 9.7 3.6 8.4 8.4 0 1 0 20.4 14.3Z"/>';
      $('meta[name="theme-color"]').content = dark ? "#151722" : "#faf9fd";
      try { localStorage.setItem("plano-respuestas-theme",mode); } catch (error) {}
    }
    let initialTheme = "light";
    try { if(localStorage.getItem("plano-respuestas-theme")==="dark") initialTheme="dark"; } catch(error){}
    applyTheme(initialTheme);
    $("#theme-switch").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));

    const homeOf = axis => document.querySelector('[data-axis-home="' + axis + '"]');
    const pillOf = axis => document.querySelector('[data-axis-pill="' + axis + '"]');
    function setAccent(id) {
      const r = routes[id];
      scene.style.setProperty("--focus",r ? r.color : "var(--accent)");
      scene.style.setProperty("--focus-bg",r ? r.bg : "var(--accent-bg)");
      scene.style.setProperty("--focus-edge",r ? r.edge : "var(--accent-border)");
    }
    function highlight(id) {
      if (current || busy) return;
      setAccent(id);
      const selected = id ? routes[id].axes : [];
      axisLines.forEach(line => {
        line.classList.toggle("is-lit",selected.includes(line.dataset.half));
        line.classList.toggle("is-dim",Boolean(id) && !selected.includes(line.dataset.half));
      });
      pills.forEach(p => p.classList.toggle("is-lit",selected.includes(p.dataset.axisPill)));
    }
    quadrants.forEach(q => {
      const id=q.dataset.route;
      q.addEventListener("pointerenter",()=>highlight(id));
      q.addEventListener("pointerleave",()=>highlight(null));
      q.addEventListener("focus",()=>highlight(id));
      q.addEventListener("blur",()=>highlight(null));
      q.addEventListener("click",()=>openRoute(id));
    });
    pills.forEach(p => p.addEventListener("click",() => {
      if(current || busy) return;
      const matching = quadrants.filter(q => routes[q.dataset.route].axes.includes(p.dataset.axisPill));
      matching.forEach(q => q.classList.add("suggested"));
      window.setTimeout(()=>matching.forEach(q=>q.classList.remove("suggested")),850);
    }));
    $("#origin").addEventListener("click",() => {
      const note=$("#origin-note"); note.hidden=!note.hidden;
      $("#origin").setAttribute("aria-expanded",String(!note.hidden));
    });
    document.addEventListener("pointerdown",event => {
      if(!$("#origin").contains(event.target) && !$("#origin-note").contains(event.target)) {
        $("#origin-note").hidden=true; $("#origin").setAttribute("aria-expanded","false");
      }
    });

    /* Cada caso pregunta y despliega la respuesta elegida, no presupone conocimientos de psicología */
    function renderContent(id) {
      const r=routes[id];
      $("#route-tag").textContent="CUADRANTE "+r.numeral;
      $("#outcome").textContent=r.name;
      $("#lead").textContent=r.lead;
      $("#case-grid").replaceChildren();
      r.cases.forEach((c,i) => {
        const card=document.createElement("section");
        card.className="case";
        card.innerHTML='<span class="case-no">CASO '+(i+1)+'</span>'+
          '<p class="situation"></p>'+
          '<p class="case-question"></p>'+
          '<div class="choices">'+
            '<button type="button" class="choice" data-type="harm" aria-expanded="false">✕ Lo que no ayuda</button>'+
            '<button type="button" class="choice" data-type="help" aria-expanded="false">✓ Lo que sí ayuda</button>'+
          '</div>'+
          '<div class="answer-fold"><div class="answer-inner"><div class="answer-box"></div></div></div>';
        card.querySelector(".situation").textContent=c.situation;
        card.querySelector(".case-question").textContent=c.question;
        const fold=card.querySelector(".answer-fold");
        const answer=card.querySelector(".answer-box");
        card.querySelectorAll(".choice").forEach(button => {
          button.addEventListener("click",() => {
            const chosen=button.dataset.type;
            const already=button.getAttribute("aria-expanded")==="true";
            card.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-expanded","false"));
            if(already) { fold.classList.remove("open"); return; }
            answer.textContent=c[chosen];
            answer.dataset.type=chosen;
            button.setAttribute("aria-expanded","true");
            fold.classList.add("open");
            if(!reduceMotion.matches) answer.animate(
              [{opacity:.35,transform:"translateY(-7px)"},{opacity:1,transform:"translateY(0)"}],
              {duration:380,easing:"cubic-bezier(.22,1,.36,1)"}
            );
          });
        });
        $("#case-grid").append(card);
      });
      $("#reflection-list").replaceChildren();
      r.reflections.forEach((pair,i) => {
        const wrap=document.createElement("div");
        wrap.className="reflection-item";
        const button=document.createElement("button");
        button.type="button"; button.className="reflection-button"; button.setAttribute("aria-expanded","false");
        button.innerHTML="<span></span><span aria-hidden='true'>+</span>";
        button.firstElementChild.textContent=pair[0];
        const fold=document.createElement("div"); fold.className="reflection-fold";
        const inner=document.createElement("div"); inner.className="reflection-inner";
        const answer=document.createElement("p"); answer.textContent=pair[1];
        inner.append(answer);fold.append(inner);
        button.addEventListener("click",() => {
          const open=button.getAttribute("aria-expanded")==="true";
          button.setAttribute("aria-expanded",String(!open));
          fold.classList.toggle("open",!open);
        });
        wrap.append(button,fold); $("#reflection-list").append(wrap);
      });
      $("#eq-one").replaceChildren(); $("#eq-two").replaceChildren();
    }

    /* Técnica FLIP: una copia visual viaja entre la etiqueta del eje y la ecuación.
       El mapa se oculta entero antes de mostrar el detalle; no queda texto superpuesto. */
    async function fly(from,to,label) {
      const a=from.getBoundingClientRect();
      const b=to.getBoundingClientRect();
      const ghost=document.createElement("div");
      ghost.className="axis-pill flying-pill";
      ghost.innerHTML=label.innerHTML;
      ghost.style.left=a.left+"px"; ghost.style.top=a.top+"px";
      ghost.style.width=a.width+"px"; ghost.style.height=a.height+"px";
      layer.append(ghost);
      if(!reduceMotion.matches) {
        const dx=b.left-a.left,dy=b.top-a.top;
        const sx=b.width/a.width,sy=b.height/a.height;
        const anim=ghost.animate([
          {transform:"translate3d(0,0,0) scale(1,1)"},
          {transform:"translate3d("+dx+"px,"+dy+"px,0) scale("+sx+","+sy+")"}
        ],{duration:920,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"});
        try {await anim.finished;}catch(error){}
      }
      ghost.remove();
    }
    async function openRoute(id) {
      if(current || busy)return;
      busy=true; scene.classList.add("busy");
      const r=routes[id];current=id;setAccent(id);
      $("#origin-note").hidden=true;$("#origin").setAttribute("aria-expanded","false");
      const sources=r.axes.map(axis=>pillOf(axis));
      const bounds=sources.map(p=>p.getBoundingClientRect());
      renderContent(id);
      detail.classList.remove("ready");detail.setAttribute("aria-hidden","false");
      // Pintar primero el detalle; el mapa completo desaparece, sin restos de letras.
      scene.dataset.view="detail";
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      const slots=[$("#eq-one"),$("#eq-two")];
      const hiddenArrivals=sources.map((pill,i)=>{
        const clone=pill.cloneNode(true);
        clone.classList.remove("is-lit");clone.classList.add("eq-pill");
        clone.removeAttribute("data-axis-pill");
        clone.setAttribute("aria-hidden","true");clone.tabIndex=-1;
        slots[i].append(clone);
        return clone;
      });
      // Los orígenes pueden dejar de renderizarse después de cambiar la vista; se conservan sus rectángulos.
      await Promise.all(bounds.map(async (rect,i) => {
        const virtualFrom={getBoundingClientRect:()=>rect};
        await fly(virtualFrom,slots[i],sources[i]);
        hiddenArrivals[i].classList.add("arrived");
      }));
      detail.classList.add("ready");scene.classList.remove("busy");busy=false;
      $("#back").focus({preventScroll:true});
    }
    async function closeRoute() {
      if(!current || busy)return;
      busy=true;scene.classList.add("busy");
      const id=current;const axes=routes[id].axes;
      const arrivals=Array.from(document.querySelectorAll(".eq-pill"));
      const start=arrivals.map(el=>el.getBoundingClientRect());
      detail.classList.remove("ready");
      arrivals.forEach(el=>el.classList.remove("arrived"));
      axes.forEach(axis=>pillOf(axis).classList.add("travelling"));
      scene.dataset.view="map";
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      await Promise.all(start.map((rect,i) => {
        const virtualFrom={getBoundingClientRect:()=>rect};
        return fly(virtualFrom,homeOf(axes[i]),pillOf(axes[i]));
      }));
      axes.forEach(axis=>pillOf(axis).classList.remove("travelling"));
      $("#eq-one").replaceChildren();$("#eq-two").replaceChildren();
      detail.setAttribute("aria-hidden","true");
      current=null;busy=false;scene.classList.remove("busy");
      highlight(null);
      const q=document.querySelector('[data-route="'+id+'"]');
      q.focus({preventScroll:true});
    }
    $("#back").addEventListener("click",closeRoute);
    document.addEventListener("keydown",event=>{
      if(event.key==="Escape" && current && !busy)closeRoute();
    });
  </script>
</body>
</html>
